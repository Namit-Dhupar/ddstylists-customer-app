# Render.com Blueprint — Docker-based deployment
# https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: dnd-stylists-api
    runtime: docker
    region: frankfurt  # EU region
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false  # Set manually in dashboard (contains secrets)
      - key: JWT_SECRET
        generateValue: true  # Auto-generate a secure random value
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: REMOVE_BG_API_KEY
        sync: false
