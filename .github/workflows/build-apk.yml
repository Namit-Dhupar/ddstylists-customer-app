name: "Build and Release Flutter APK"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.x
          channel: stable
          cache: true

      - name: Clean Gradle Cache
        run: rm -rf ~/.gradle/caches

      - name: Flutter Clean
        working-directory: ./frontend
        run: flutter clean

      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          echo "--- Keystore SHA-1 ---"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep SHA1

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > frontend/android/app/google-services.json
          echo "--- google-services.json package ---"
          cat frontend/android/app/google-services.json | python3 -c "import sys,json; print(json.load(sys.stdin)['client'][0]['client_info']['android_client_info']['package_name'])" 2>/dev/null || echo "Could not parse"

      - name: Build APK
        working-directory: ./frontend
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
