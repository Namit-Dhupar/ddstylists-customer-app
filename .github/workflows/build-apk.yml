name: "Build and Release Flutter APK"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (Requirement for Android build)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Clean Flutter Build Cache
        working-directory: ./frontend
        run: flutter clean

      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Regenerate Android project files
        working-directory: ./frontend
        run: flutter create --platforms=android .

      - name: Patch Android Gradle Configs
        working-directory: ./frontend
        run: |
          sed -i -E 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "2.3.10" apply false/' android/settings.gradle
          if [ -f "android/build.gradle" ]; then sed -i -E "s/ext.kotlin_version = '.+'/ext.kotlin_version = '2.3.10'/g" android/build.gradle; fi
          sed -i -E 's/compileSdk .*$/compileSdk 34/' android/app/build.gradle
          sed -i -E 's/compileSdkVersion .*$/compileSdkVersion 34/' android/app/build.gradle
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF

      - name: Build APK Release
        working-directory: ./frontend
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
