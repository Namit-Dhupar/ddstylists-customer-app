name: frontend
description: "D&D Stylists Customer Application Frontend"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Routing
  go_router: ^14.0.0
  
  # Network & API
  dio: ^5.4.3+1
  
  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.1
  
  # UI & Assets
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  
  # Authentication
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.0.0
  sign_in_with_apple: ^6.1.1
  
  # Payments
  flutter_stripe: ^10.1.1
  razorpay_flutter: ^1.3.6
  
  # Video Communication
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.0
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  macos:
    generate: true
    image_path: "assets/logo.png"
  image_path: "assets/logo.png"
  min_sdk_size: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
